<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Psychedelic art portfolio by Whoamiii — altered perception, bodily portals and tactile digital artifacts." />
    <meta name="theme-color" content="#09090b" />
    <link rel="canonical" href="https://whoamiii.art/" />
    <meta property="og:title" content="Whoamiii — Psychedelic art portfolio" />
    <meta property="og:description" content="Altered perception, bodily portals and tactile digital artifacts." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whoamiii.art/" />
    <meta property="og:image" content="https://whoamiii.art/social-preview.png" />
    <meta property="og:image:alt" content="Preview of the hero section in Whoamiii's psychedelic art portfolio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whoamiii — Psychedelic art portfolio" />
    <meta name="twitter:description" content="Altered perception, bodily portals and tactile digital artifacts." />
    <meta name="twitter:image" content="https://whoamiii.art/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/liquid-perception-hero-720.avif"
      media="(max-width: 767px)"
      type="image/avif"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/liquid-perception-hero-1440.avif"
      media="(min-width: 768px)"
      type="image/avif"
      imagesrcset="/images/liquid-perception-hero-960.avif 960w, /images/liquid-perception-hero-1440.avif 1440w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Whoamiii — Psychedelic art portfolio</title>
    <style>
      /* Critical inline styles to prevent FOUC */
      body { background: #09090b; margin: 0; }
      #root,
      .app-static-shell {
        min-height: 100vh;
        min-height: 100svh;
      }
      .app-static-shell {
        position: relative;
        overflow-x: hidden;
        color: rgba(246, 242, 238, 0.94);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090b;
      }
      .app-static-shell a {
        color: inherit;
        text-decoration: none;
      }
      .app-static-hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.48) 42%, rgba(9, 9, 11, 0.18) 100%),
          linear-gradient(0deg, rgba(9, 9, 11, 0.92) 0%, rgba(9, 9, 11, 0.18) 40%, rgba(9, 9, 11, 0.38) 100%),
          image-set(
            url("/images/liquid-perception-hero-720.avif") type("image/avif"),
            url("/images/liquid-perception-hero-720.webp") type("image/webp")
          ) center / cover no-repeat,
          linear-gradient(180deg, #0b0712 0%, #09090b 100%);
      }
      .app-static-nav {
        position: absolute;
        z-index: 2;
        left: clamp(1rem, 5vw, 4.25rem);
        right: clamp(1rem, 5vw, 4.25rem);
        top: clamp(1rem, 4vw, 2rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: clamp(0.42rem, 1.05vw, 0.95rem);
      }
      .app-static-logo {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        width: min(11.75rem, 57vw);
        overflow: hidden;
        border: 1px solid rgba(247, 250, 255, 0.5);
        border-radius: 999px;
        padding: 1rem 1.05rem;
        color: rgba(225, 249, 255, 0.96);
        background:
          radial-gradient(circle at 22% 14%, rgba(255, 255, 255, 0.2), transparent 32%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(8, 12, 18, 0.48));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -16px 28px rgba(0, 0, 0, 0.24),
          0 14px 34px rgba(0, 0, 0, 0.3);
        font: italic 900 clamp(1.1rem, 5.8vw, 1.78rem)/0.8 "Arial Narrow", "Avenir Next Condensed", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.055em;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.22),
          0 7px 13px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(20px) saturate(150%);
      }
      .app-static-link {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(230, 246, 255, 0.38);
        border-radius: 999px;
        padding: 0.92rem 1rem;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035)),
          rgba(9, 10, 16, 0.34);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.36),
          0 12px 28px rgba(0, 0, 0, 0.24);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        backdrop-filter: blur(20px) saturate(150%);
      }
      .app-static-copy {
        position: absolute;
        z-index: 1;
        left: clamp(2rem, 8vw, 5rem);
        right: 1.5rem;
        top: min(68vh, 35.5rem);
      }
      .app-static-kicker {
        margin: 0 0 2.5rem;
        color: rgba(235, 232, 229, 0.7);
        font: 500 0.86rem/1.2 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.32em;
        text-shadow: 0 0.1rem 0.6rem rgba(0, 0, 0, 0.6);
      }
      .app-static-title {
        margin: 0;
        max-width: 36rem;
        color: transparent;
        font: italic 900 clamp(3.02rem, 16.2vw, 4.72rem)/0.8 "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.06em;
        -webkit-text-stroke: 0.48px rgba(238, 252, 255, 0.38);
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0) 0 31%, rgba(255, 252, 231, 0.72) 43%, rgba(113, 228, 246, 0.54) 51%, rgba(255, 255, 255, 0) 63%),
          linear-gradient(128deg, #eafcff 0%, #a9edf5 22%, #f5dec0 42%, #d68a78 58%, #b8b1ed 78%, #f6fbff 100%);
        background-size: 165% 165%, 230% 230%;
        background-position: 52% 45%, 0% 48%;
        -webkit-background-clip: text;
        background-clip: text;
        filter:
          drop-shadow(0.009em 0.022em 0.018em rgba(2, 6, 16, 0.52))
          drop-shadow(0 0 0.055em rgba(94, 219, 242, 0.16));
      }
      .app-static-subtitle {
        max-width: 18rem;
        margin: 2.6rem 0 0;
        color: rgba(248, 244, 241, 0.88);
        font-size: clamp(1.32rem, 5.4vw, 2rem);
        line-height: 1.38;
        text-shadow: 0 0.18rem 0.9rem rgba(0, 0, 0, 0.68);
      }
      .app-static-work {
        padding: 4rem clamp(1.25rem, 5vw, 5rem) 5rem;
        background:
          radial-gradient(circle at 18% 0%, rgba(103, 232, 249, 0.13), transparent 32rem),
          radial-gradient(circle at 90% 8%, rgba(245, 222, 192, 0.1), transparent 28rem),
          #09090b;
      }
      .app-static-work-label {
        margin: 0 0 0.85rem;
        color: rgba(235, 232, 229, 0.62);
        font-size: 0.74rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .app-static-work h2 {
        margin: 0 0 1.5rem;
        max-width: 18rem;
        font-size: clamp(2.1rem, 12vw, 4.8rem);
        line-height: 0.9;
        letter-spacing: -0.04em;
      }
      .app-static-grid {
        display: grid;
        gap: 1rem;
      }
      .app-static-card {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.05);
      }
      .app-static-card img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
      }
      .app-static-card picture {
        display: block;
      }
      .app-static-card-placeholder {
        display: block;
        aspect-ratio: 4 / 5;
        background:
          radial-gradient(circle at 28% 18%, rgba(103, 232, 249, 0.18), transparent 34%),
          radial-gradient(circle at 72% 82%, rgba(245, 222, 192, 0.11), transparent 38%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.018));
      }
      .app-static-card figcaption {
        padding: 0.95rem 1rem 1.1rem;
        color: rgba(245, 241, 236, 0.82);
        font-size: 0.95rem;
      }
      @media (min-width: 768px) {
        .app-static-hero {
          background:
            linear-gradient(90deg, rgba(9, 9, 11, 0.9) 0%, rgba(9, 9, 11, 0.5) 37%, rgba(9, 9, 11, 0.12) 100%),
            linear-gradient(0deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.12) 48%, rgba(9, 9, 11, 0.3) 100%),
            image-set(
              url("/images/liquid-perception-hero-1440.avif") type("image/avif"),
              url("/images/liquid-perception-hero-1440.webp") type("image/webp")
            ) center 42% / cover no-repeat,
            linear-gradient(180deg, #0b0712 0%, #09090b 100%);
        }
        .app-static-nav {
          grid-template-columns: minmax(10.5rem, 27vw) minmax(8rem, 1fr);
        }
        .app-static-logo {
          justify-content: center;
          width: auto;
          padding: clamp(2.05rem, 2.55vw, 2.55rem) clamp(1.7rem, 3.5vw, 3.5rem);
          font-size: clamp(1.75rem, 3.65vw, 4.25rem);
        }
        .app-static-link {
          padding: clamp(1.45rem, 1.7vw, 1.75rem) clamp(1.05rem, 2.1vw, 2.05rem);
          text-align: right;
        }
        .app-static-copy {
          left: 5rem;
          top: 14rem;
        }
        .app-static-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .app-static-card img {
          aspect-ratio: 3 / 4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-static-shell">
        <section class="app-static-hero" aria-label="Forhåndsvisning av Whoamiii-porteføljen">
          <nav class="app-static-nav" aria-label="Forhåndsvisningsnavigasjon">
            <a class="app-static-logo" href="/">WHOAMIII</a>
            <a class="app-static-link" href="#work">Verk</a>
          </nav>
          <div class="app-static-copy">
            <p class="app-static-kicker">PSYCHEDELIC ART PORTFOLIO</p>
            <h1 class="app-static-title">Altered<br />Perception.</h1>
          </div>
        </section>
        <section id="work" class="app-static-work" aria-label="Forhåndsvisning av utvalgte verk">
          <p class="app-static-work-label">Kuratert utvalg</p>
          <h2>Utvalgte verk.</h2>
          <div class="app-static-grid">
            <figure class="app-static-card">
              <picture>
                <source type="image/avif" srcset="/images/video5-optical-focus-poster-480.avif" />
                <img src="/images/video5-optical-focus-poster-480.webp" alt="Posterbilde fra Video 5 der en hånd møter et mørkt rom med optisk psykedelisk forskyvning" loading="lazy" decoding="async" fetchpriority="low" />
              </picture>
              <figcaption>Optisk fokus</figcaption>
            </figure>
            <figure class="app-static-card">
              <span class="app-static-card-placeholder" aria-hidden="true"></span>
              <figcaption>Kaffeflate</figcaption>
            </figure>
            <figure class="app-static-card">
              <span class="app-static-card-placeholder" aria-hidden="true"></span>
              <figcaption>Levende gulv</figcaption>
            </figure>
            <figure class="app-static-card">
              <span class="app-static-card-placeholder" aria-hidden="true"></span>
              <figcaption>Tatovert sopphånd</figcaption>
            </figure>
            <figure class="app-static-card">
              <span class="app-static-card-placeholder" aria-hidden="true"></span>
              <figcaption>Dybdefokus</figcaption>
            </figure>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
