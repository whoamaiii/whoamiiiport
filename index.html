<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Psychedelic art portfolio by Whoamiii — exploring altered perceptions through vibrant colors, intricate patterns, and surreal landscapes." />
    <meta name="theme-color" content="#09090b" />
    <link rel="canonical" href="https://whoamiii.art/" />
    <meta property="og:title" content="Whoamiii — Psychedelic Art Portfolio" />
    <meta property="og:description" content="Exploring the boundaries of consciousness through vibrant colors, intricate patterns, and surreal landscapes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whoamiii.art/" />
    <meta property="og:image" content="https://whoamiii.art/social-preview.png" />
    <meta property="og:image:alt" content="Desktop preview of the Whoamiii psychedelic art portfolio hero section." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whoamiii — Psychedelic Art Portfolio" />
    <meta name="twitter:description" content="Exploring the boundaries of consciousness through vibrant colors, intricate patterns, and surreal landscapes." />
    <meta name="twitter:image" content="https://whoamiii.art/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/liquid-perception-hero-720.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/liquid-perception-hero-1440.webp"
      media="(min-width: 768px)"
      imagesrcset="/images/liquid-perception-hero-960.webp 960w, /images/liquid-perception-hero-1440.webp 1440w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Whoamiii — Psychedelic Art Portfolio</title>
    <style>
      /* Critical inline styles to prevent FOUC */
      body { background: #09090b; margin: 0; }
      #root,
      .app-boot-shell {
        min-height: 100vh;
        min-height: 100svh;
      }
      .app-boot-shell {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.48) 42%, rgba(9, 9, 11, 0.18) 100%),
          linear-gradient(0deg, rgba(9, 9, 11, 0.92) 0%, rgba(9, 9, 11, 0.18) 40%, rgba(9, 9, 11, 0.38) 100%),
          url("/images/liquid-perception-hero-720.webp") center / cover no-repeat,
          linear-gradient(180deg, #0b0712 0%, #09090b 100%);
      }
      .app-boot-shell::before {
        content: "WHOAMIII";
        position: absolute;
        left: clamp(1.75rem, 5vw, 4.25rem);
        top: clamp(1.5rem, 5vw, 3.25rem);
        min-width: min(18rem, 55vw);
        border: 1px solid rgba(247, 250, 255, 0.72);
        border-radius: 999px;
        padding: 1.08rem 2.1rem;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(15, 15, 20, 0.58);
        box-shadow: 0 0 1.25rem rgba(220, 238, 255, 0.34), inset 0 0 1.6rem rgba(255, 255, 255, 0.13);
        font: italic 900 clamp(1.05rem, 4vw, 1.6rem)/1 "Arial Narrow", "Avenir Next Condensed", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.04em;
        text-shadow: 0 0.08rem 0.25rem rgba(0, 0, 0, 0.7);
      }
      .app-boot-shell__kicker {
        content: "PSYCHEDELIC ART PORTFOLIO";
        position: absolute;
        left: clamp(2rem, 8vw, 5rem);
        right: 2rem;
        top: min(68vh, 35.5rem);
        color: rgba(235, 232, 229, 0.7);
        font: 500 0.86rem/1.2 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.32em;
        text-shadow: 0 0.1rem 0.6rem rgba(0, 0, 0, 0.6);
        white-space: nowrap;
      }
      .app-boot-shell__title {
        position: absolute;
        left: clamp(2rem, 8vw, 5rem);
        right: 1.5rem;
        top: calc(min(68vh, 35.5rem) + 2.5rem);
        max-width: 36rem;
        color: transparent;
        white-space: pre;
        font: italic 900 clamp(3.02rem, 16.2vw, 4.72rem)/0.8 "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.06em;
        -webkit-text-stroke: 0.48px rgba(238, 252, 255, 0.38);
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0) 0 31%, rgba(255, 252, 231, 0.72) 43%, rgba(113, 228, 246, 0.54) 51%, rgba(255, 255, 255, 0) 63%),
          linear-gradient(128deg, #eafcff 0%, #a9edf5 22%, #f5dec0 42%, #d68a78 58%, #b8b1ed 78%, #f6fbff 100%);
        background-size: 165% 165%, 230% 230%;
        background-position: 52% 45%, 0% 48%;
        -webkit-background-clip: text;
        background-clip: text;
        filter:
          drop-shadow(0.009em 0.022em 0.018em rgba(2, 6, 16, 0.52))
          drop-shadow(0 0 0.055em rgba(94, 219, 242, 0.16));
      }
      .app-boot-shell__hint {
        position: absolute;
        left: clamp(2rem, 8vw, 5rem);
        bottom: 2rem;
        width: 2.8rem;
        height: 0.18rem;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }
      .app-boot-shell__hint::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #9eeaf4, #f0dfc3);
        animation: boot-scan 1.35s ease-in-out infinite;
      }
      @keyframes boot-scan {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
      @media (min-width: 768px) {
        .app-boot-shell {
          background:
            linear-gradient(90deg, rgba(9, 9, 11, 0.9) 0%, rgba(9, 9, 11, 0.5) 37%, rgba(9, 9, 11, 0.12) 100%),
            linear-gradient(0deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.12) 48%, rgba(9, 9, 11, 0.3) 100%),
            url("/images/liquid-perception-hero-1440.webp") center / cover no-repeat,
            linear-gradient(180deg, #0b0712 0%, #09090b 100%);
        }
        .app-boot-shell__kicker,
        .app-boot-shell__title,
        .app-boot-shell__hint {
          left: 5rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-shell__hint::after {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-shell" aria-hidden="true">
        <div class="app-boot-shell__kicker">PSYCHEDELIC ART PORTFOLIO</div>
        <div class="app-boot-shell__title">Altered<br />Perceptions.</div>
        <div class="app-boot-shell__hint"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
